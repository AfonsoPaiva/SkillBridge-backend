steps:
  # Build the container image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillbridge/backend:$COMMIT_SHA', '.']

  # Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillbridge/backend:$COMMIT_SHA']

  # Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'skillbridge-backend'
      - '--image'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillbridge/backend:$COMMIT_SHA'
      - '--region'
      - 'europe-west1'
      - '--platform'
      - 'managed'
      - '--set-env-vars'
      - 'GCS_BUCKET_NAME=skillbridge-uploads,GCS_PROJECT_ID=$PROJECT_ID'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/skillbridge/backend:$COMMIT_SHA'
