basePath: /api
definitions:
  models.ContactLinks:
    properties:
      facebook:
        type: string
      github:
        type: string
      instagram:
        type: string
      linkedin:
        type: string
      tiktok:
        type: string
      twitter:
        type: string
      website:
        type: string
    type: object
  models.Conversation:
    properties:
      created_at:
        type: string
      id:
        type: integer
      messages:
        items:
          $ref: '#/definitions/models.Message'
        type: array
      user_a:
        $ref: '#/definitions/models.User'
      user_a_id:
        description: lower  user ID
        type: integer
      user_b:
        $ref: '#/definitions/models.User'
      user_b_id:
        description: higher user ID
        type: integer
    type: object
  models.Message:
    properties:
      conversation_id:
        type: integer
      created_at:
        type: string
      encrypted_content:
        description: Base64-encoded ciphertext — the server cannot read this.
        type: string
      ephemeral_key:
        description: Base64-encoded ephemeral X25519 public key used for this message's
          ECDH.
        type: string
      id:
        type: integer
      read_at:
        description: Timestamp the recipient acknowledged the message (nil = unread).
        type: string
      sender:
        $ref: '#/definitions/models.User'
      sender_id:
        type: integer
    type: object
  models.Project:
    properties:
      created_at:
        type: string
      description:
        type: string
      id:
        type: integer
      members:
        items:
          $ref: '#/definitions/models.ProjectMember'
        type: array
      owner:
        $ref: '#/definitions/models.User'
      owner_id:
        type: integer
      owners:
        items:
          $ref: '#/definitions/models.ProjectOwner'
        type: array
      roles:
        items:
          $ref: '#/definitions/models.ProjectRole'
        type: array
      status:
        description: open / in_progress / completed
        type: string
      title:
        type: string
    type: object
  models.ProjectMember:
    properties:
      id:
        type: integer
      joined_at:
        type: string
      project_id:
        type: integer
      role_id:
        type: integer
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
    type: object
  models.ProjectOwner:
    properties:
      added_at:
        type: string
      id:
        type: integer
      project_id:
        type: integer
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
    type: object
  models.ProjectRole:
    properties:
      description:
        type: string
      filled:
        type: boolean
      id:
        type: integer
      project_id:
        type: integer
      skill:
        $ref: '#/definitions/models.Skill'
      skill_id:
        type: integer
    type: object
  models.Skill:
    properties:
      id:
        type: integer
      name:
        type: string
    type: object
  models.User:
    properties:
      avatar_url:
        type: string
      bio:
        type: string
      contact_links:
        $ref: '#/definitions/models.ContactLinks'
      course:
        type: string
      created_at:
        type: string
      email:
        type: string
      firebase_uid:
        type: string
      id:
        type: integer
      name:
        type: string
      owned_projects:
        items:
          $ref: '#/definitions/models.Project'
        type: array
      project_members:
        items:
          $ref: '#/definitions/models.ProjectMember'
        type: array
      skills:
        description: Relações
        items:
          $ref: '#/definitions/models.UserSkill'
        type: array
      university:
        type: string
      year:
        type: integer
    type: object
  models.UserPublicKey:
    properties:
      algorithm:
        description: Algorithm used — currently only "X25519"
        type: string
      id:
        type: integer
      public_key:
        description: Base64-encoded raw public key bytes (32 bytes → 44 chars in base64)
        type: string
      updated_at:
        type: string
      user:
        $ref: '#/definitions/models.User'
      user_id:
        type: integer
    type: object
  models.UserSkill:
    properties:
      id:
        type: integer
      level:
        description: beginner / intermediate / advanced
        type: string
      skill:
        $ref: '#/definitions/models.Skill'
      skill_id:
        type: integer
      user_id:
        type: integer
    type: object
host: localhost:8080
info:
  contact: {}
  description: API para a plataforma SkillBridge — liga estudantes e projetos.
  title: SkillBridge API
  version: "1.0"
paths:
  /conversations:
    get:
      description: Devolve todas as conversas do utilizador autenticado, ordenadas
        pela mais recente
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Conversation'
            type: array
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar conversas
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Cria uma conversa privada com outro utilizador (idempotente — se
        já existir devolve a existente)
      parameters:
      - description: ID do outro utilizador
        in: body
        name: input
        required: true
        schema:
          properties:
            user_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Conversation'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Iniciar conversa
      tags:
      - messages
  /conversations/{id}/messages:
    get:
      description: Devolve as mensagens cifradas de uma conversa. O cliente desencripta-as
        localmente com a sua chave privada.
      parameters:
      - description: ID da conversa
        in: path
        name: id
        required: true
        type: integer
      - description: Número máximo de mensagens (default 50)
        in: query
        name: limit
        type: integer
      - description: Devolver apenas mensagens com ID inferior a este (paginação)
        in: query
        name: before
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Message'
            type: array
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Listar mensagens
      tags:
      - messages
    post:
      consumes:
      - application/json
      description: Envia uma mensagem E2E cifrada. O corpo deve conter o ciphertext
        em base64 (AES-256-GCM) e a chave efémera X25519 (base64) usada no ECDH.
      parameters:
      - description: ID da conversa
        in: path
        name: id
        required: true
        type: integer
      - description: Conteúdo cifrado e chave efémera
        in: body
        name: input
        required: true
        schema:
          properties:
            encrypted_content:
              type: string
            ephemeral_key:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Message'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Enviar mensagem
      tags:
      - messages
  /conversations/{id}/read:
    put:
      description: Atualiza o campo read_at das mensagens recebidas ainda não lidas
      parameters:
      - description: ID da conversa
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Marcar como lido
      tags:
      - messages
  /donations/create-intent:
    post:
      consumes:
      - application/json
      description: Cria um PaymentIntent no Stripe; o frontend usa o clientSecret
        para completar o pagamento
      parameters:
      - description: Valor em cêntimos (mín. 100) e email do doador
        in: body
        name: input
        required: true
        schema:
          properties:
            amount:
              type: integer
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Criar intenção de donativo
      tags:
      - donations
  /donations/stats:
    get:
      description: Devolve o total e contagem de donativos confirmados
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
      summary: Estatísticas de donativos
      tags:
      - donations
  /donations/webhook:
    post:
      consumes:
      - application/json
      description: Recebe eventos do Stripe (payment_intent.succeeded / payment_intent.payment_failed)
      parameters:
      - description: Assinatura do Stripe
        in: header
        name: Stripe-Signature
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: boolean
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Webhook Stripe
      tags:
      - donations
  /messages/keys:
    put:
      consumes:
      - application/json
      description: Guarda a chave pública X25519 (base64) do utilizador autenticado.
        Necessária para que outros utilizadores possam enviar mensagens cifradas.
      parameters:
      - description: Chave pública X25519 em base64
        in: body
        name: input
        required: true
        schema:
          properties:
            public_key:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserPublicKey'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Registar chave pública
      tags:
      - messages
  /messages/keys/{user_id}:
    get:
      description: Devolve a chave pública X25519 (base64) de um utilizador, necessária
        para cifrar mensagens destinadas a ele
      parameters:
      - description: ID do utilizador destinatário
        in: path
        name: user_id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.UserPublicKey'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obter chave pública
      tags:
      - messages
  /projects:
    get:
      description: Lista todos os projetos com estado 'open'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Project'
            type: array
      summary: Listar projetos
      tags:
      - projects
    post:
      consumes:
      - application/json
      description: Cria um novo projeto
      parameters:
      - description: Dados do projeto
        in: body
        name: input
        required: true
        schema:
          properties:
            description:
              type: string
            title:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Criar projeto
      tags:
      - projects
  /projects/{id}:
    get:
      description: Devolve os detalhes de um projeto
      parameters:
      - description: ID do projeto
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.Project'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obter projeto por ID
      tags:
      - projects
  /projects/{id}/join:
    post:
      consumes:
      - application/json
      description: Envia uma candidatura para participar num projeto
      parameters:
      - description: ID do projeto
        in: path
        name: id
        required: true
        type: integer
      - description: Role pretendida
        in: body
        name: input
        schema:
          properties:
            role_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Candidatar a projeto
      tags:
      - projects
  /projects/{id}/owners:
    post:
      consumes:
      - application/json
      description: Um proprietário existente pode adicionar outro utilizador como
        co-proprietário
      parameters:
      - description: ID do projeto
        in: path
        name: id
        required: true
        type: integer
      - description: ID do utilizador a adicionar
        in: body
        name: input
        required: true
        schema:
          properties:
            user_id:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "403":
          description: Forbidden
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
        "409":
          description: Conflict
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Adicionar co-proprietário
      tags:
      - projects
  /upload/image:
    delete:
      description: Remove uma imagem local do servidor
      parameters:
      - description: 'Caminho relativo da imagem (ex: avatars/xxx.jpg)'
        in: query
        name: filename
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Remover imagem
      tags:
      - upload
    post:
      consumes:
      - multipart/form-data
      description: Faz upload e redimensiona uma imagem (avatar 400x400 ou projeto
        1280x720)
      parameters:
      - description: 'Tipo de imagem: avatar (default) ou project'
        in: query
        name: type
        type: string
      - description: Ficheiro de imagem (JPEG, PNG, GIF, WebP — máx 10MB)
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Upload de imagem
      tags:
      - upload
  /users/{id}:
    get:
      description: Devolve o perfil público de um utilizador
      parameters:
      - description: ID do utilizador
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Obter utilizador por ID
      tags:
      - users
  /users/me:
    get:
      description: Devolve o perfil do utilizador autenticado
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.User'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Obter perfil próprio
      tags:
      - users
    put:
      consumes:
      - application/json
      description: Atualiza os dados do perfil do utilizador autenticado
      parameters:
      - description: Dados a atualizar
        in: body
        name: input
        schema:
          properties:
            avatar_url:
              type: string
            bio:
              type: string
            course:
              type: string
            name:
              type: string
            university:
              type: string
            year:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Atualizar perfil
      tags:
      - users
  /users/password-reset:
    post:
      consumes:
      - application/json
      description: Gera um link Firebase e envia por email ao utilizador
      parameters:
      - description: Email do utilizador
        in: body
        name: input
        required: true
        schema:
          properties:
            email:
              type: string
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Pedir redefinição de palavra-passe
      tags:
      - users
  /users/register:
    post:
      consumes:
      - application/json
      description: Cria um perfil de utilizador após autenticação Firebase
      parameters:
      - description: Dados do utilizador (email é lido automaticamente do token Firebase)
        in: body
        name: input
        required: true
        schema:
          properties:
            bio:
              type: string
            course:
              type: string
            name:
              type: string
            university:
              type: string
            year:
              type: integer
          type: object
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            additionalProperties: true
            type: object
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "500":
          description: Internal Server Error
          schema:
            additionalProperties:
              type: string
            type: object
      security:
      - BearerAuth: []
      summary: Criar utilizador
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
